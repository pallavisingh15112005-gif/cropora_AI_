[theme]
base = "light"
primaryColor = "#166534"
backgroundColor = "#FAF8F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1917"
borderColor = "#E7E2D8"
linkColor = "#166534"
baseRadius = "12px"
buttonRadius = "11px"
showWidgetBorder = true
showSidebarBorder = false
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
baseFontSize = 15
headingFontSizes = ["36px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [800, 700, 700, 700, 600, 600]
chartCategoricalColors = ["#166534", "#84CC16", "#D97706", "#0284C7", "#DC2626"]

[theme.sidebar]
backgroundColor = "#10241A"
secondaryBackgroundColor = "#173325"
borderColor = "#24402E"

[server]
maxUploadSize = 25

[browser]
gatherUsageStats = false
